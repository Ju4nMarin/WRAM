name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Compilación y pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compilar y ejecutar pruebas
        shell: cmd
        run: build.cmd

      - name: Reporte de pruebas
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: build/junit-core.xml
          check_name: Pruebas del núcleo

      - name: Hash y tamaño del ejecutable
        shell: pwsh
        run: |
          $h = Get-FileHash build/WRAM.exe -Algorithm SHA256
          "$($h.Hash)  WRAM.exe" | Out-File build/WRAM.exe.sha256 -Encoding ascii
          Get-Content build/WRAM.exe.sha256
          "Tamaño: $((Get-Item build/WRAM.exe).Length) bytes"

      # Comprueba que el paquete MSIX se arma; la identidad de prueba no sirve para la tienda.
      - name: Paquete MSIX de prueba
        shell: pwsh
        run: ./tools/package-msix.ps1 -Version 0.0.0 -IdentityName Test.WRAM -Publisher "CN=WRAM Test" -OutDir build/msix-test

      - name: Artefactos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WRAM-${{ github.sha }}
          path: |
            build/WRAM.exe
            build/WRAM.exe.sha256
            build/junit-core.xml

  asan:
    name: Pruebas con AddressSanitizer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compilar y ejecutar pruebas con AddressSanitizer
        shell: cmd
        run: build.cmd asan

      - name: Reporte de pruebas
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: build-asan/junit-asan.xml
          check_name: Pruebas con AddressSanitizer

  release:
    name: Publicación de la versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, asan]
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compilar y ejecutar pruebas
        shell: cmd
        run: build.cmd

      # Firma de código con SignPath (certificado de SignPath Foundation para proyectos de código abierto).
      # Se activa con las variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG y SIGNPATH_SIGNING_POLICY_SLUG
      # y el secreto SIGNPATH_API_TOKEN del repositorio. Cada firma la aprueba a mano un aprobador en SignPath.
      - name: Ejecutable sin firmar para SignPath
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WRAM-unsigned-${{ github.ref_name }}
          path: build/WRAM.exe
          if-no-files-found: error

      - name: Firma con SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/signed

      - name: Ejecutable firmado en lugar del original
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Copy-Item build/signed/WRAM.exe build/WRAM.exe -Force
          $sig = Get-AuthenticodeSignature build/WRAM.exe
          "Firma: $($sig.Status) / $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "La firma del ejecutable no es válida" }

      - name: Hash del ejecutable
        shell: pwsh
        run: |
          $h = Get-FileHash build/WRAM.exe -Algorithm SHA256
          "$($h.Hash)  WRAM.exe" | Out-File build/WRAM.exe.sha256 -Encoding ascii

      # Manifiestos de Scoop y winget con la URL y el hash de esta versión.
      - name: Manifiestos de Scoop y winget
        shell: pwsh
        run: |
          $hash = (Get-Content build/WRAM.exe.sha256).Split(" ")[0]
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./tools/package-manifests.ps1 -Version $version -Sha256 $hash -OutDir build/packages -Repo "${{ github.repository }}"

      # Paquete MSIX para Microsoft Store, con la identidad que asigna Partner Center
      # (variables MSIX_IDENTITY_NAME y MSIX_PUBLISHER del repositorio). Se sube a Partner Center a mano.
      - name: Paquete para Microsoft Store
        if: vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./tools/package-msix.ps1 -Version $version -IdentityName "${{ vars.MSIX_IDENTITY_NAME }}" -Publisher "${{ vars.MSIX_PUBLISHER }}" -OutDir build/msix

      - name: Artefacto del paquete para Microsoft Store
        if: vars.MSIX_IDENTITY_NAME != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WRAM-msix-${{ github.ref_name }}
          path: build/msix/*.msix
          if-no-files-found: error

      # Atestación de procedencia firmada con Sigstore: prueba que el ejecutable salió de este
      # repositorio, de este commit y de este workflow. Se verifica con `gh attestation verify`.
      - name: Atestación de procedencia
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/WRAM.exe

      - name: Publicar en Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $hash = (Get-Content build/WRAM.exe.sha256).Split(" ")[0]
          $notes = @"
          Download ``WRAM.exe``, move it to a permanent folder and run it. Guide: [docs/installation.md](https://github.com/${{ github.repository }}/blob/main/docs/installation.md).

          | File | SHA-256 |
          |---|---|
          | WRAM.exe | ``$hash`` |

          Scoop: ``scoop install https://github.com/${{ github.repository }}/releases/latest/download/wram.json``

          Build provenance: ``gh attestation verify WRAM.exe --repo ${{ github.repository }}``

          Changes: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) · [Release integrity](https://github.com/${{ github.repository }}#release-integrity)
          "@
          $notes | Out-File notes.md -Encoding utf8
          gh release create $tag build/WRAM.exe build/WRAM.exe.sha256 build/packages/wram.json (Get-ChildItem build/packages/winget/*.yaml).FullName --title "WRAM $($tag.TrimStart('v'))" --notes-file notes.md
