name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Compilación y pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compilar y ejecutar pruebas
        shell: cmd
        run: build.cmd

      - name: Reporte de pruebas
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: build/junit-core.xml
          check_name: Pruebas del núcleo

      - name: Hash y tamaño del ejecutable
        shell: pwsh
        run: |
          $h = Get-FileHash build/WRAM.exe -Algorithm SHA256
          "$($h.Hash)  WRAM.exe" | Out-File build/WRAM.exe.sha256 -Encoding ascii
          Get-Content build/WRAM.exe.sha256
          "Tamaño: $((Get-Item build/WRAM.exe).Length) bytes"

      - name: Artefactos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WRAM-${{ github.sha }}
          path: |
            build/WRAM.exe
            build/WRAM.exe.sha256
            build/junit-core.xml

  release:
    name: Publicación de la versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compilar y ejecutar pruebas
        shell: cmd
        run: build.cmd

      - name: Hash del ejecutable
        shell: pwsh
        run: |
          $h = Get-FileHash build/WRAM.exe -Algorithm SHA256
          "$($h.Hash)  WRAM.exe" | Out-File build/WRAM.exe.sha256 -Encoding ascii

      # Atestación de procedencia firmada con Sigstore: prueba que el ejecutable salió de este
      # repositorio, de este commit y de este workflow. Se verifica con `gh attestation verify`.
      - name: Atestación de procedencia
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/WRAM.exe

      - name: Publicar en Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $hash = (Get-Content build/WRAM.exe.sha256).Split(" ")[0]
          $notes = @"
          Download ``WRAM.exe``, move it to a permanent folder and run it. Guide: [docs/installation.md](https://github.com/${{ github.repository }}/blob/main/docs/installation.md).

          | File | SHA-256 |
          |---|---|
          | WRAM.exe | ``$hash`` |

          Build provenance: ``gh attestation verify WRAM.exe --repo ${{ github.repository }}``

          Changes: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          "@
          $notes | Out-File notes.md -Encoding utf8
          gh release create $tag build/WRAM.exe build/WRAM.exe.sha256 --title "WRAM $($tag.TrimStart('v'))" --notes-file notes.md
